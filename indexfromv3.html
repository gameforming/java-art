
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java's Art Gen V4</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 25px 15px;
  background: #100d1c;
  color: #f4efff;
  font-family: Arial, sans-serif;
}
main { max-width: 1050px; margin: auto; }
h1 { text-align: center; color: #c9a5ff; }
.subtitle { text-align: center; color: #aaa0bd; margin-bottom: 25px; }
.panel {
  background: #1d1830;
  border: 1px solid #40345e;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
}
label { display: block; margin: 15px 0 7px; font-weight: bold; }
input, select, button { font: inherit; }
input[type="range"] { width: 100%; }
input[type="file"], select {
  width: 100%;
  padding: 10px;
  color: white;
  background: #29213e;
  border: 1px solid #51436f;
  border-radius: 8px;
}
button {
  border: 0;
  border-radius: 9px;
  padding: 12px 17px;
  background: #9663df;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin: 7px 5px 0 0;
}
button:hover { background: #ad80ef; }
button.secondary { background: #39304e; }
#dropzone {
  border: 2px dashed #705a98;
  border-radius: 12px;
  padding: 25px;
  text-align: center;
  color: #b9a8d8;
  cursor: pointer;
}
#dropzone.drag { background: #33264d; }
.preview-wrap {
  overflow: auto;
  background: #fff;
  border-radius: 10px;
  padding: 12px;
  max-height: 650px;
}
#preview {
  font-family: "Noto Color Emoji", "Apple Color Emoji",
    "Segoe UI Emoji", sans-serif;
  font-size: 16px;
  line-height: 1;
  white-space: pre;
  letter-spacing: 0;
  width: max-content;
  margin: 0;
}
#sourcePreview {
  display: block;
  max-width: 100%;
  max-height: 250px;
  margin: 15px auto 0;
  border-radius: 8px;
}
.stats { color: #b9a8d8; font-size: 13px; }
.hint { color: #aaa0bd; font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>🎨 Java's Art Gen V4</h1>
  <p class="subtitle">Turn images into clean emoji pixel art</p>

  <section class="panel">
    <div id="dropzone">
      <strong>Drop an image here</strong><br>
      or click to select a file
      <input id="file" type="file" accept="image/*" hidden>
    </div>
    <img id="sourcePreview" hidden alt="Source image preview">
  </section>

  <section class="panel">
    <label for="width">Width: <span id="widthValue">32</span> pixels</label>
    <input id="width" type="range" min="8" max="80" value="32">

    <label for="height">Height: <span id="heightValue">32</span> pixels</label>
    <input id="height" type="range" min="8" max="80" value="32">

    <label>
      <input id="proportions" type="checkbox" checked>
      Keep image proportions
    </label>

    <label for="palette">Color palette</label>
    <select id="palette">
      <option value="full">Full color palette</option>
      <option value="basic">Basic colors</option>
      <option value="warm">Warm colors</option>
      <option value="cool">Cool colors</option>
      <option value="mono">Black, gray and white</option>
    </select>

    <label for="detail">Detail preservation</label>
    <select id="detail">
      <option value="high">High — preserve more details</option>
      <option value="medium" selected>Medium — focus on major details</option>
      <option value="low">Low — simplify large shapes</option>
    </select>
    <p class="hint">
      High keeps more small features. Medium prioritizes recognizable
      shapes and important details. Low creates simpler color blocks.
    </p>

    <button id="generate">Generate Pixel Art</button>
  </section>

  <section class="panel">
    <h2>Result</h2>
    <div class="preview-wrap">
      <pre id="preview">Upload an image to get started...</pre>
    </div>
    <p id="stats" class="stats"></p>
    <button id="copy">Copy Emoji Art</button>
    <button id="download" class="secondary">Download .txt</button>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let image = null;
let output = "";

const palettes = {
  full: [
    ["⬛",20,20,25], ["🩶",135,135,140], ["⬜",245,245,245],
    ["🟥",220,35,45], ["🟧",240,125,30], ["🟨",245,215,45],
    ["🟩",45,165,75], ["🟦",45,105,220], ["🟪",135,65,190],
    ["🟫",125,75,40], ["🩷",245,145,175], ["🩵",105,205,225]
  ],
  basic: [
    ["⬛",20,20,25], ["⬜",245,245,245], ["🟥",220,35,45],
    ["🟨",245,215,45], ["🟩",45,165,75], ["🟦",45,105,220]
  ],
  warm: [
    ["⬛",20,20,25], ["⬜",245,245,245], ["🟥",220,35,45],
    ["🟧",240,125,30], ["🟨",245,215,45], ["🟫",125,75,40],
    ["🩷",245,145,175]
  ],
  cool: [
    ["⬛",20,20,25], ["⬜",245,245,245], ["🩶",135,135,140],
    ["🟩",45,165,75], ["🟦",45,105,220], ["🟪",135,65,190],
    ["🩵",105,205,225]
  ],
  mono: [
    ["⬛",20,20,25], ["🩶",135,135,140], ["⬜",245,245,245]
  ]
};

const labCache = {};

function linearize(v) {
  v /= 255;
  return v <= 0.04045 ? v / 12.92 :
    Math.pow((v + 0.055) / 1.055, 2.4);
}

function rgbToLab(r,g,b) {
  r = linearize(r);
  g = linearize(g);
  b = linearize(b);

  let x = (r*.4124 + g*.3576 + b*.1805) / .95047;
  let y = r*.2126 + g*.7152 + b*.0722;
  let z = (r*.0193 + g*.1192 + b*.9505) / 1.08883;

  const f = t => t > .008856 ? Math.cbrt(t) : 7.787*t + 16/116;
  x=f(x); y=f(y); z=f(z);

  return [116*y-16, 500*(x-y), 200*(y-z)];
}

function getPalette() {
  const name = $("palette").value;
  if (!labCache[name]) {
    labCache[name] = palettes[name].map(p => ({
      emoji:p[0], lab:rgbToLab(p[1],p[2],p[3])
    }));
  }
  return labCache[name];
}

function nearestColor(r,g,b,palette) {
  const lab = rgbToLab(r,g,b);
  let best = palette[0], bestDistance = Infinity;

  for (const color of palette) {
    const d =
      (lab[0]-color.lab[0])**2 +
      (lab[1]-color.lab[1])**2 +
      (lab[2]-color.lab[2])**2;

    if (d < bestDistance) {
      bestDistance = d;
      best = color;
    }
  }
  return best.emoji;
}

function updateHeight() {
  if (!image || !$("proportions").checked) return;
  const w = Number($("width").value);
  const h = Math.max(8, Math.min(80,
    Math.round(w * image.height / image.width)));
  $("height").value = h;
  $("heightValue").textContent = h;
}

$("width").addEventListener("input", () => {
  $("widthValue").textContent = $("width").value;
  updateHeight();
});
$("height").addEventListener("input", () => {
  $("heightValue").textContent = $("height").value;
});
$("proportions").addEventListener("change", updateHeight);

$("dropzone").addEventListener("click", () => $("file").click());
$("dropzone").addEventListener("dragover", e => {
  e.preventDefault();
  $("dropzone").classList.add("drag");
});
$("dropzone").addEventListener("dragleave", () =>
  $("dropzone").classList.remove("drag"));
$("dropzone").addEventListener("drop", e => {
  e.preventDefault();
  $("dropzone").classList.remove("drag");
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
$("file").addEventListener("change", e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

function loadFile(file) {
  if (!file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    image = img;
    $("sourcePreview").src = url;
    $("sourcePreview").hidden = false;
    updateHeight();
    generate();
  };
  img.src = url;
}

// Keep meaningful features while removing only tiny isolated color noise.
function preserveMajorDetails(grid, strength) {
  const h = grid.length;
  const w = grid[0].length;

  if (strength === 0) return grid;

  const next = grid.map(row => row.slice());
  const threshold = strength === 1 ? 7 : 6;

  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const current = grid[y][x];
      const counts = {};

      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const c = grid[y+dy][x+dx];
          counts[c] = (counts[c] || 0) + 1;
        }
      }

      let majority = current;
      let max = 0;

      for (const [color,count] of Object.entries(counts)) {
        if (count > max) {
          max = count;
          majority = color;
        }
      }

      // Only replace a pixel when almost all neighbors agree.
      // This protects edges and small recognizable features.
      if (majority !== current && max >= threshold) {
        next[y][x] = majority;
      }
    }
  }
  return next;
}

function generate() {
  if (!image) {
    $("preview").textContent = "Upload an image to get started...";
    return;
  }

  const w = Number($("width").value);
  const h = Number($("height").value);

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", {willReadFrequently:true});

  canvas.width = w;
  canvas.height = h;
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,w,h);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(image,0,0,w,h);

  const data = ctx.getImageData(0,0,w,h).data;
  const palette = getPalette();

  let grid = [];

  for (let y=0; y<h; y++) {
    const row = [];
    for (let x=0; x<w; x++) {
      const i = (y*w+x)*4;
      row.push(nearestColor(data[i],data[i+1],data[i+2],palette));
    }
    grid.push(row);
  }

  const detail = $("detail").value;
  const smoothingStrength =
    detail === "high" ? 0 :
    detail === "medium" ? 1 : 2;

  grid = preserveMajorDetails(grid,smoothingStrength);

  output = grid.map(row => row.join("")).join("\n");
  $("preview").textContent = output;
  $("stats").textContent =
    `${w} × ${h} pixels · ${w*h} emoji cells · No dithering`;
}

$("generate").addEventListener("click",generate);

$("copy").addEventListener("click",async () => {
  if (!output) return;
  try {
    await navigator.clipboard.writeText(output);
    $("copy").textContent = "Copied!";
    setTimeout(() => $("copy").textContent = "Copy Emoji Art",1500);
  } catch {
    alert("Copying failed. Please select and copy the preview manually.");
  }
});

$("download").addEventListener("click",() => {
  if (!output) return;
  const blob = new Blob([output],{type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "javas-art.txt";
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
